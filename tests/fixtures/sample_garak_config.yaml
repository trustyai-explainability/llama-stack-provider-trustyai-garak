# Sample garak config used in tests.
# Mirrors the structure of GarakCommandConfig.
system:
  verbose: false
  parallel_requests: 0
  parallel_attempts: 1

run:
  seed: 42
  eval_threshold: 0.5
  generations: 5
  deprefix: true
  spec:
    include:
      - probes.encoding.InjectBase64
      - probes.promptinject.HijackHateHumans
    exclude: []

plugins:
  target_type: openai.OpenAICompatible
  target_name: target-llm

  extended_detectors: false

  probes: {}
  detectors: {}
  buffs: {}

reporting:
  taxonomy: owasp
  report_prefix: scan
